<!DOCTYPE html>
<html lang="hr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tenis Liga — Registracija</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <div class="auth-page">
    <div class="auth-card">
      <!-- LIJEVO: forma -->
      <div class="auth-form-col">
        <div class="auth-box">
          <div class="logo">Pozdrav!</div>
          <p class="tag">Napravi svoj račun kako bi nastavio dalje.</p>

          <div id="msg" class="msg"></div>

          <form id="register-form">
            <div class="field">
              <label for="username">Nadimak (ime u ligi)</label>
              <input type="text" id="username" required maxlength="20" placeholder="npr. Karlo" />
            </div>
            <div class="field">
              <label for="email">Email</label>
              <input type="email" id="email" required autocomplete="email" />
            </div>
            <div class="field">
              <label for="password">Lozinka (min. 6 znakova)</label>
              <input type="password" id="password" required minlength="6" autocomplete="new-password" />
            </div>
            <button type="submit" class="btn" id="submit">Registracija</button>
          </form>

          <p class="auth-switch">
            Već imaš račun? <a href="index.html">Prijavi se</a>
          </p>
        </div>
      </div>

      <!-- DESNO: velika slika (zamijeni images/auth.jpg) -->
      <div class="auth-visual">
        <video autoplay muted loop playsinline class="auth-visual-video">
          <source src="videos/bg2.mp4" type="video/mp4">
        </video>
        <div class="auth-visual-inner">
          <h2 class="big">Tenis liga <span>SB</span></h2>
          <p>Postani najbolji.</p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/register.js"></script>
</body>

</html>
